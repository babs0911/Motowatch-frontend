<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script src="config.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const backendUrl = Config.getBackendUrl();
            try {
                const res = await fetch(`${backendUrl}/auth/api/session`, { mode: 'cors' });
                const data = await res.json();
                if (data.authenticated) {
                    window.location.href = 'portal.html';
                } else {
                    window.location.href = 'login.html';
                }
            } catch (err) {
                console.error('Connection failed:', err);
                window.location.href = 'login.html';
            }
        });
    </script>
</head>
<body style="background: #0d1b2a; color: #ffffff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
        <div style="border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
        <div>Loading MotoWatch...</div>
    </div>
    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</body>
</html>
