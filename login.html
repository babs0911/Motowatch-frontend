<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MotoWatch</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            max-width: 450px;
            margin: 10vh auto;
        }
        .config-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .config-btn:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="screen-overlay"></div>
    
    <!-- Config Trigger Button -->
    <div class="config-btn" onclick="configureBackend()" title="Configure Backend URL">
        <i class="bi bi-gear-fill"></i>
    </div>

    <div class="container">
        <div class="login-container">
            <div class="text-center mb-4">
                <h1 class="fw-bold tracking-wide" style="font-size: 2.2rem; letter-spacing: 1px;">
                    <i class="bi bi-shield-check text-primary"></i> MotoWatch
                </h1>
                <p class="text-muted">Helmet Detection & License Plate OCR System</p>
            </div>

            <div class="card p-4">
                <div class="card-body">
                    <h3 class="card-title text-center text-white mb-4">Account Login</h3>
                    
                    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>
                    
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label text-white-50 small">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 text-white-50"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control border-start-0" id="username" required placeholder="Enter username">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label text-white-50 small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 text-white-50"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control border-start-0" id="password" required placeholder="Enter password">
                            </div>
                        </div>
                        
                        <div class="mb-4 d-flex justify-content-between align-items-center">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label text-white-50 small" for="remember">Remember me</label>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="submitBtn">
                            <span id="btnText">Sign In</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="text-center mt-3">
                <span class="text-white-50 small">Current Backend: </span>
                <span id="backendUrlText" class="text-primary small fw-semibold">Loading...</span>
            </div>
        </div>
    </div>

    <!-- Configuration Modal -->
    <div class="modal fade" id="configModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary">
                <div class="modal-header border-secondary text-white">
                    <h5 class="modal-title"><i class="bi bi-gear"></i> Configure Backend API</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-white">
                    <p class="small text-white-50">Enter the public URL generated by your local Cloudflare Tunnel or your local dev server address.</p>
                    <div class="mb-3">
                        <label for="backendUrlInput" class="form-label">Backend URL</label>
                        <input type="url" class="form-control bg-secondary text-white border-0" id="backendUrlInput" placeholder="https://xxxx.trycloudflare.com">
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveBackendUrl()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Configuration management -->
    <script src="config.js"></script>
    <script>
        // Check session: if already logged in, redirect to dashboard.html
        window.addEventListener('DOMContentLoaded', async () => {
            const backendUrl = Config.getBackendUrl();
            document.getElementById('backendUrlText').textContent = backendUrl;
            document.getElementById('backendUrlInput').value = backendUrl;
            
            try {
                const res = await fetch(`${backendUrl}/auth/api/session`, { 
                    headers: { 'Accept': 'application/json' },
                    mode: 'cors'
                });
                const data = await res.json();
                if (data.authenticated) {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                console.log('Not logged in or backend offline:', err);
            }
        });

        // Toggle configuration modal
        const configModal = new bootstrap.Modal(document.getElementById('configModal'));
        function configureBackend() {
            configModal.show();
        }

        function saveBackendUrl() {
            const inputVal = document.getElementById('backendUrlInput').value;
            Config.setBackendUrl(inputVal);
            document.getElementById('backendUrlText').textContent = Config.getBackendUrl();
            configModal.hide();
            window.location.reload();
        }

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            alertBox.classList.add('d-none');
            submitBtn.disabled = true;
            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const backendUrl = Config.getBackendUrl();

            try {
                const res = await fetch(`${backendUrl}/auth/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username, password }),
                    mode: 'cors'
                });

                const data = await res.json();
                
                if (data.success) {
                    // Save username/role in localStorage for quick reference on frontend
                    localStorage.setItem('user_name', data.user.username);
                    localStorage.setItem('user_role', data.user.role);
                    window.location.href = 'dashboard.html';
                } else {
                    alertBox.textContent = data.error || 'Invalid credentials';
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                console.error(err);
                alertBox.textContent = 'Could not connect to backend server. Make sure it is running and the URL is correct.';
                alertBox.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
