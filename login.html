<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoWatch — Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(rgba(13, 27, 42, 0.8), rgba(13, 27, 42, 0.8)),
            url("img/bg.png") no-repeat center center fixed !important;
            background-size: cover !important;
            min-height: 100vh;
            font-family: 'Open Sans', sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portal-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
        }

        .auth-form-box {
            background: rgba(13, 56, 128, 0.45);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 45px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .input-field {
            margin-bottom: 25px;
            position: relative;
        }

        .input-field input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            color: #333;
            outline: none;
            transition: box-shadow 0.2s;
        }

        .input-field input:focus {
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.5);
            background: #ffffff;
        }

        .input-field .icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 1.2rem;
        }

        .btn-submit {
            width: 100%;
            background: #205cc2;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-submit:hover {
            background: #184da8;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .config-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.2s;
            z-index: 20;
        }
        
        .config-btn:hover {
            color: #ffffff;
        }

        #alertBox {
            font-size: 0.9rem;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    
    <div class="portal-content">
        <div class="auth-box" style="width: 100%; display: flex; justify-content: center;">
            <div class="auth-form-box">
                <!-- Config Trigger Button inside Form Box -->
                <div class="config-btn" onclick="configureBackend()" title="Configure Backend URL">
                    <i class="bi bi-gear-fill"></i>
                </div>

                <div class="brand-header text-center" style="margin-bottom: 30px;">
                    <img src="img/logo.png" alt="Logo" style="height: 50px; width: auto; margin-bottom: 20px; filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.3));">
                    <h1 style="font-family: 'Montserrat', sans-serif; font-size: 1.8rem; font-weight: 800; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); letter-spacing: 1px;">
                        MOTOWATCH SYSTEM
                    </h1>
                    <p style="font-size: 0.95rem; opacity: 0.9; margin-bottom: 0;">Where Innovation Meets Road Safety.</p>
                </div>

                <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="input-field">
                        <i class="bi bi-person-fill icon"></i>
                        <input type="text" id="username" placeholder="Username" required autocomplete="username">
                    </div>
                    <div class="input-field">
                        <i class="bi bi-lock-fill icon"></i>
                        <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 25px;">
                        <button type="submit" class="btn-submit" id="submitBtn">
                            <span id="btnText">Log In</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="text-center mt-4">
            <span class="text-white-50 small">Current Backend Connection: </span>
            <span id="backendUrlText" class="text-primary small fw-semibold">Loading...</span>
        </div>
    </div>

    <!-- Configuration Modal -->
    <div class="modal fade" id="configModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary">
                <div class="modal-header border-secondary text-white">
                    <h5 class="modal-title"><i class="bi bi-gear"></i> Configure Backend API</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-white">
                    <p class="small text-white-50">Enter the public URL generated by your local Cloudflare Tunnel or your local dev server address.</p>
                    <div class="mb-3">
                        <label for="backendUrlInput" class="form-label">Backend URL</label>
                        <input type="url" class="form-control bg-secondary text-white border-0" id="backendUrlInput" placeholder="https://xxxx.trycloudflare.com">
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveBackendUrl()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Configuration management -->
    <script src="config.js"></script>
    <script>
        // Check session: if already logged in, redirect to dashboard.html
        window.addEventListener('DOMContentLoaded', async () => {
            const backendUrl = Config.getBackendUrl();
            document.getElementById('backendUrlText').textContent = backendUrl;
            document.getElementById('backendUrlInput').value = backendUrl;
            
            try {
                const res = await fetch(`${backendUrl}/auth/api/session`, { 
                    headers: { 'Accept': 'application/json' },
                    mode: 'cors'
                });
                const data = await res.json();
                if (data.authenticated) {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                console.log('Not logged in or backend offline:', err);
            }
        });

        // Toggle configuration modal
        const configModal = new bootstrap.Modal(document.getElementById('configModal'));
        function configureBackend() {
            configModal.show();
        }

        function saveBackendUrl() {
            const inputVal = document.getElementById('backendUrlInput').value;
            Config.setBackendUrl(inputVal);
            document.getElementById('backendUrlText').textContent = Config.getBackendUrl();
            configModal.hide();
            window.location.reload();
        }

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            alertBox.classList.add('d-none');
            submitBtn.disabled = true;
            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const backendUrl = Config.getBackendUrl();

            try {
                const res = await fetch(`${backendUrl}/auth/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username, password }),
                    mode: 'cors'
                });

                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('user_name', data.user.username);
                    localStorage.setItem('user_role', data.user.role);
                    window.location.href = 'dashboard.html';
                } else {
                    alertBox.textContent = data.error || 'Invalid credentials';
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                console.error(err);
                alertBox.textContent = 'Could not connect to backend server. Make sure it is running and the URL is correct.';
                alertBox.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
